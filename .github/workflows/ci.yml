name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: markettrace
          POSTGRES_PASSWORD: markettrace
          POSTGRES_DB: markettrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markettrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://markettrace:markettrace@localhost:5432/markettrace
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  deploy:
    # Only run the deploy job on an actual push to `main` (not on PRs).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v5
      - name: Deploy (placeholder)
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          echo "Deploy job triggered on main branch"
          if [ -n "$DEPLOY_KEY" ]; then
            echo "DEPLOY_KEY found — add your deployment commands here"
            # Example (commented): scp/build/push to server or run kubectl/gh-pages/etc.
            # scp -i $DEPLOY_KEY -r ./frontend/dist user@host:/var/www/html
          else
            echo "No DEPLOY_KEY secret configured — skipping actual deploy."
          fi

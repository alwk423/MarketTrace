server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (react-router-dom) means most paths (/login,
    # /history, ...) don't correspond to a real file - fall back to
    # index.html and let the SPA's own router handle it, instead of nginx's
    # default behavior of 404ing anything that isn't a file on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
